<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="description" content="砂・水・火・油などが相互作用する粉遊び（Falling Sand）サンドボックス。WebGL2で発光表現。" />
  <title>Falling Sand — 粉遊び</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene"></canvas>
  <!-- 風ベクトルと引力点を可視化する透明キャンバス -->
  <canvas id="fields"></canvas>
  <!-- 生きもの（虫・ドラゴン）を重ね描きする透明キャンバス。描画操作は下の #scene が受ける -->
  <canvas id="creatures"></canvas>

  <!-- タイトルと操作ヒント（クリックを妨げないよう pointer-events は無効） -->
  <div class="overlay">
    <h1 class="overlay__title">Falling Sand</h1>
    <p class="overlay__hint" id="mode-hint" aria-live="polite">素材を選んで画面をなぞる</p>
  </div>

  <!-- 操作パネル：素材パレット・筆サイズ・停止・消去 -->
  <div class="toolbar">
    <div class="palette" id="palette" aria-label="素材パレット"></div>
    <div class="toolstrip" id="field-tools" aria-label="音と力場の操作">
      <button type="button" class="toolstrip__btn toolstrip__btn--active" data-field-tool="material" aria-pressed="true">素材</button>
      <button type="button" class="toolstrip__btn toolstrip__btn--wind" data-field-tool="wind" aria-pressed="false">風</button>
      <button type="button" class="toolstrip__btn toolstrip__btn--attractor" data-field-tool="attractor" aria-pressed="false">引力</button>
      <button type="button" class="toolstrip__btn" data-field-tool="field-eraser" aria-pressed="false">場消し</button>
      <button type="button" id="rotate-gravity" class="toolstrip__btn" aria-label="重力を時計回りに回す">重力 ↓</button>
      <button type="button" id="toggle-sound" class="toolstrip__btn" aria-pressed="false">音 OFF</button>
      <button type="button" id="clear-fields" class="toolstrip__btn">力場消去</button>
    </div>
    <div class="controls">
      <label class="controls__brush">
        筆
        <input type="range" id="brush-size" aria-label="筆の大きさ" />
      </label>
      <button type="button" id="toggle-pause" class="controls__btn" aria-pressed="false">停止</button>
      <button type="button" id="clear" class="controls__btn">消去</button>
    </div>
  </div>

  <!-- WebGL/描画非対応時のフォールバック -->
  <p class="fallback">お使いのブラウザは描画に対応していないため表示できません。</p>

  <script type="module" src="main.js"></script>
</body>
</html>
