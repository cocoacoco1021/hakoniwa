<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="description" content="砂・水・火・油などが相互作用する粉遊び（Falling Sand）サンドボックス。WebGL2で発光表現。" />
  <title>Falling Sand — 粉遊び</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene"></canvas>
  <!-- 風ベクトルと引力点を可視化する透明キャンバス -->
  <canvas id="fields"></canvas>
  <!-- 生きもの（虫・ドラゴン）を重ね描きする透明キャンバス。描画操作は下の #scene が受ける -->
  <canvas id="creatures"></canvas>

  <!-- タイトルと操作ヒント（上部操作パネルと重ならないよう左下へ配置） -->
  <div class="overlay">
    <h1 class="overlay__title">Falling Sand</h1>
    <p class="overlay__hint" id="mode-hint" aria-live="polite">素材を選んで画面をなぞる</p>
  </div>

  <!-- 操作パネル：閉じても選択中の道具が分かり、遊び場を広く保てる -->
  <div class="toolbar" id="toolbar">
    <button type="button" class="toolbar__toggle" id="toggle-toolbar" aria-expanded="false" aria-controls="toolbar-content">
      <span class="toolbar__selection">
        <span class="toolbar__selection-swatch" id="toolbar-selection-swatch" aria-hidden="true"></span>
        <span id="toolbar-selection-label" aria-live="polite">選択: 砂</span>
      </span>
      <span class="toolbar__toggle-label" id="toolbar-toggle-label">操作を開く</span>
      <span class="toolbar__chevron" id="toolbar-chevron" aria-hidden="true">▼</span>
    </button>

    <div class="toolbar__content" id="toolbar-content" hidden>
      <div class="palette" id="palette" aria-label="素材パレット"></div>
      <div class="toolstrip" id="field-tools" aria-label="音と力場の操作">
        <button type="button" class="toolstrip__btn toolstrip__btn--active" data-field-tool="material" aria-pressed="true">素材</button>
        <button type="button" class="toolstrip__btn toolstrip__btn--wind" data-field-tool="wind" aria-pressed="false">風</button>
        <button type="button" class="toolstrip__btn toolstrip__btn--attractor" data-field-tool="attractor" aria-pressed="false">引力</button>
        <button type="button" class="toolstrip__btn" data-field-tool="field-eraser" aria-pressed="false">場消し</button>
        <button type="button" id="rotate-gravity" class="toolstrip__btn" aria-label="重力を時計回りに回す">重力 ↓</button>
        <button type="button" id="toggle-sound" class="toolstrip__btn" aria-pressed="false">音 OFF</button>
        <button type="button" id="clear-fields" class="toolstrip__btn">力場消去</button>
      </div>
      <div class="timeline" id="timeline-controls" aria-label="時間操作" hidden>
        <span class="timeline__label">時間</span>
        <button type="button" id="replay-history" class="timeline__btn" aria-pressed="false">履歴再生</button>
        <input type="range" id="time-scrubber" min="0" max="0" value="0" disabled aria-label="時間を巻き戻す" />
        <output id="timeline-position" class="timeline__position" for="time-scrubber">いま</output>
      </div>
      <div class="controls">
        <label class="controls__brush" id="brush-size-control">
          <span>筆サイズ</span>
          <input type="range" id="brush-size" aria-label="筆の大きさ" />
          <output id="brush-size-value" for="brush-size">--</output>
        </label>
        <label class="controls__dragon-size" id="dragon-size-control" hidden>
          <span>ドラゴンサイズ</span>
          <input type="range" id="dragon-size" aria-label="ドラゴンの表示サイズ" />
          <output id="dragon-size-value" for="dragon-size">--</output>
        </label>
        <button type="button" id="toggle-pause" class="controls__btn" aria-pressed="false">停止</button>
        <button type="button" id="clear" class="controls__btn">消去</button>
      </div>
    </div>
  </div>

  <!-- WebGL/描画非対応時のフォールバック -->
  <p class="fallback">お使いのブラウザは描画に対応していないため表示できません。</p>

  <script type="module" src="main.js"></script>
</body>
</html>
